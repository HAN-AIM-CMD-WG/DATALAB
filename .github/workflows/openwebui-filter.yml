name: openwebui-filter

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "anonimiseer/apps/openwebui-filter/**"
      - ".github/workflows/openwebui-filter.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "anonimiseer/apps/openwebui-filter/**"
      - ".github/workflows/openwebui-filter.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: anonimiseer/apps/openwebui-filter

jobs:
  test:
    name: Test filter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest -ra

      - name: Syntax check (filter is uploaded as-is in Open WebUI)
        run: python -m py_compile nl_pii_filter.py
