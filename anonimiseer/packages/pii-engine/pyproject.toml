[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-engine"
version = "0.1.1"
description = "Nederlandse PII-detectie en anonimiseringsengine (Presidio + NL-uitbreidingen) voor de Anonimiseer-toolketen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DataLab" }]
keywords = ["pii", "anonimiseren", "presidio", "gdpr", "avg", "nederlands", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Natural Language :: Dutch",
]
dependencies = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7,<3.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pymupdf>=1.24.10",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
nl-small = [
    "nl-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_sm-3.8.0/nl_core_news_sm-3.8.0-py3-none-any.whl",
]
nl-medium = [
    "nl-core-news-md @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_md-3.8.0/nl_core_news_md-3.8.0-py3-none-any.whl",
]
nl-large = [
    "nl-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl",
]
bundle = [
    "pyinstaller>=6.11.0",
    # nl_core_news_lg wordt gebundeld voor de desktop-app: ~568 MB model maar
    # geeft de beste namen-recall voor Nederlands zonder dat de gebruiker iets
    # hoeft te downloaden. Alternatief (sm/md) is kleiner maar mist vaker
    # complexere namen als "Dr. Anna van der Heide-Janssen".
    "nl-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl",
]
sonar = [
    "transformers>=4.46.0",
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-requests",
]

[project.scripts]
pii-engine = "pii_engine.__main__:main"

[project.urls]
Homepage = "https://github.com/datalab/anonimiseer"
Issues = "https://github.com/datalab/anonimiseer/issues"

[tool.setuptools]
packages = [
    "pii_engine",
    "pii_engine.recognizers",
    "pii_engine.config",
    "pii_engine.static",
    "pii_engine.documents",
    "pii_engine.models",
]

[tool.setuptools.package-data]
"pii_engine.static" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",
    # Nederlandse typografie: en-dash (–) in docstrings/strings/comments
    # is opzettelijk (correcte schrijfwijze), niet vervangen door hyphen.
    # Ook dotless-i (ı) is geldig voor namen als "Aysenur Tan ı".
    "RUF001",  # ambiguous unicode in strings
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803"]
# api.py heeft binnen-functie helpers (FastAPI route closures) waarbij
# UPPER_CASE constants en `File(...)` defaults idiomatisch zijn.
"pii_engine/api.py" = ["N806", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["pii_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "slow: tests die externe modellen downloaden of inference doen (SoNaR-BERT, spaCy-lg)",
]
